name: release-image

# Publish the container image for a release tag.
#
# Without this, a `vX.Y.Z` release created a tag and a GitHub release but NO
# image — which is how the Seibert dev deploy ended up in Init:ErrImagePull on
# k8s-apply:v0.25.0. The build machinery already existed in Makefile.docker
# (`make buca` = build upload clean apply); nothing in CI ever ran it.
#
# Registry is GHCR rather than the GCP Artifact Registry: GHCR authenticates with
# the workflow's own GITHUB_TOKEN, so the repo needs no long-lived cloud
# credential. The cost is that the consuming cluster must carry a pull secret for
# ghcr.io — the `seibertmedia` pull secret does not cover it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the release tag
        # Tag by the GIT TAG, not by branch. Makefile.docker's targets tag by
        # $(BRANCH); publishing a branch-named tag would produce an image that
        # does not match what the deploy manifest pins.
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          echo "building ${image}"
          docker build --tag "${image}" .
          docker push "${image}"
          echo "published ${image}"
